[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1"

[workspace.dependencies]
oo-formats = { path = "crates/oo-formats" }
anyhow = "1"
thiserror = "2"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
bevy = "0.20"

# Bevy is unbearably slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
